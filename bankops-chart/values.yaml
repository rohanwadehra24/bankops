replicaCount: 1

image:
  repository: bankops
  pullPolicy: IfNotPresent
  tag: "1.0"

service:
  type: ClusterIP
  port: 8000

autoscaling:
  enabled: false

serviceAccount:
  create: false
  name: default

 # External access is disabled for our local Kind cluster
ingress:
  enabled: false

httpRoute:
  enabled: false

# Optional Pod configuration
podAnnotations: {}
podLabels: {}

# Container and Pod security settings
podSecurityContext: {}
securityContext: {}

# Kubernetes application health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# FastAPI resource requests and limits
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Optional Kubernetes configurations
volumeMounts: []
volumes: []
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []

postgresql:
  replicaCount: 1
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  service:
    port: 5432

  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    existingClaim: ""
