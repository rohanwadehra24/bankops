alertmanager:
  enabled: false
extraScrapeConfigs: |
  - job_name: 'bankops'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'bankops-gitops-bankops-chart.bankops-gitops.svc.cluster.local:8000'
pushgateway:
  enabled: false
server:
  persistentVolume:
    enabled: false
serverFiles:
  alerting_rules.yml:
    groups:
    - name: bankops-alerts
      rules:
      - alert: BankOpsServerErrors
        annotations:
          summary: BankOps is experiencing HTTP 5xx errors
        expr: sum(rate(http_requests_total{job="bankops",status="5xx"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
      - alert: BankOpsSLOFastBurn
        annotations:
          summary: BankOps is consuming its SLO error budget rapidly
        expr: |
          (
            (
              (sum(rate(http_requests_total{job="bankops",status="5xx",handler!~"/health|/metrics"}[1h])) or vector(0))
              /
              sum(rate(http_requests_total{job="bankops",handler!~"/health|/metrics"}[1h]))
            ) > 0.0144
          )
          and
          (
            (
              (sum(rate(http_requests_total{job="bankops",status="5xx",handler!~"/health|/metrics"}[5m])) or vector(0))
              /
              sum(rate(http_requests_total{job="bankops",handler!~"/health|/metrics"}[5m]))
            ) > 0.0144
          )
        for: 2m
        labels:
          severity: critical
      - alert: BankOpsSLOSlowBurn
        annotations:
          summary: BankOps is experiencing sustained SLO error budget consumption
        expr: |
          (
            (
              (sum(rate(http_requests_total{job="bankops",status="5xx",handler!~"/health|/metrics"}[6h])) or vector(0))
              /
              sum(rate(http_requests_total{job="bankops",handler!~"/health|/metrics"}[6h]))
            ) > 0.006
          )
          and
          (
            (
              (sum(rate(http_requests_total{job="bankops",status="5xx",handler!~"/health|/metrics"}[30m])) or vector(0))
              /
              sum(rate(http_requests_total{job="bankops",handler!~"/health|/metrics"}[30m]))
            ) > 0.006
          )
        for: 5m
        labels:
          severity: warning
