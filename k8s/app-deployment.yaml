apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankops-app
  namespace: bankops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankops-app
  template:
    metadata:
      labels:
        app: bankops-app
    spec:
      containers:
        - name: bankops-app
          image: bankops:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bankops-db-secret
                  key: database-url


          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
